name: CI

on:
  push:
    branches: [main, feature/GROUP2_Peer_Review_Group1]
  pull_request:
    branches: [main, feature/GROUP2_Peer_Review_Group1]

jobs:
  # LINT JOB: Static Code Quality Analysis
  lint:
    name: Lint (Area 2)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Static analysis with pylint (parser.py - Area 2)
        run: |
          pylint mkdocs_cdoc/parser.py \
            --disable=C0114,C0115,C0116,R0903,R0913,R0914,R0915,C0301,W0511 \
            --fail-under=7.0

      - name: Static analysis with flake8 (parser.py - Area 2)
        run: |
          flake8 mkdocs_cdoc/parser.py \
            --count --max-line-length=120 --extend-ignore=E203 --statistics

  # Area 2 Specific Test Execution
  test:
    name: Test (Area 2)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Area 2 tests with coverage (parser tests only)
        run: |
          pytest tests/test_cdoc.py::TestCleanComment \
                  tests/test_cdoc.py::TestGtkdocToRst \
                  tests/test_cdoc.py::TestRstToMarkdown \
                  tests/test_cdoc.py::TestParseFileRegex \
                  tests/test_cdoc.py::TestParseFile \
                  -v --cov=mkdocs_cdoc/parser \
                  --cov-report=term-missing \
                  --cov-report=html:coverage_report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage_report/
          retention-days: 30

  # Documentation Compilation & Validation
  build:
    name: Build Documentation (Area 2 Impact)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Build documentation with MkDocs
        run: |
          cd example
          mkdocs build
          
      - name: Verify build artifacts
        run: |
          if [ ! -d "example/site" ]; then
            echo "ERROR: Documentation build failed - site/ directory not found"
            exit 1
          fi
          if [ ! -f "example/site/index.html" ]; then
            echo "ERROR: Critical index.html missing from build output"
            exit 1
          fi
          echo "✓ Documentation build successful"
          echo "✓ Site directory contains $(find example/site -type f | wc -l) files"

      - name: Upload built documentation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkdocs-site
          path: example/site/
          retention-days: 30
